# cargo-deny config — supply-chain gates run in CI.
# `cargo deny check` fails the build on advisories, license drift, or
# unvetted dependency sources.

[advisories]
# Known-vulnerable dependency versions always fail (implicit in 0.20);
# these gates cover unmaintained crates and yanked versions.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Workspace licenses; dependencies must be under one of these.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
private = { ignore = true }

[bans]
# No duplicate major versions without an explicit skip.
multiple-versions = "warn"
# Internal members are `path`-only deps (no version req) which read as
# "wildcards"; warn so real `*` ranges on published crates still surface.
wildcards = "warn"
deny = []
skip = []

[sources]
# Only crates.io; no git/path-only external deps in the release graph.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
