name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RUSTFLAGS: -D warnings

jobs:
  dist:
    name: build + publish release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build artifacts (tarball + deb + checksums)
        run: ./scripts/dist.sh

      - name: extract release notes for tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md." > release-notes.md

      - name: publish github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "presswork ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              dist/*.tar.gz dist/*.deb dist/SHA256SUMS
          fi
