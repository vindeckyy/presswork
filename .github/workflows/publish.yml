name: publish crates

# Publishes the crates.io-facing library crates in dependency order.
# Runs on every published GitHub release and manually; versions that
# are already uploaded are skipped.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish (dependency order)
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: publish crates in dependency order
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          set -u
          # Leaves first; crates that depend on published crates last.
          for c in ipp-codec presswork-sys backend-common cups-tls cups-log cups-config; do
            for attempt in 1 2 3 4 5; do
              out=$(cargo publish -p "$c" --token "$CARGO_REGISTRY_TOKEN" 2>&1) && {
                echo "$out" | tail -3; break;
              }
              echo "$out" | tail -5
              case "$out" in
                *"already uploaded"*|*"already exists"*) break ;;
                *"no matching package"*|*"failed to select a version"*)
                  echo "dependency index not ready; retrying in 30s"; sleep 30 ;;
                *) exit 1 ;;
              esac
              [ "$attempt" = 5 ] && exit 1
            done
          done
