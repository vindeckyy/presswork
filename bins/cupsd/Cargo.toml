[package]
name = "cupsd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cups-config = { path = "../../crates/cups-config" }
httpd = { path = "../../crates/httpd" }
ipp-codec = { path = "../../crates/ipp-codec" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "signal", "fs", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
