[package]
name = "presswork-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ipp-codec = { path = "../crates/ipp-codec" }
cups-config = { path = "../crates/cups-config" }

[[bin]]
name = "ipp_decode"
path = "fuzz_targets/ipp_decode.rs"
test = false
doc = false

[[bin]]
name = "config_lexer"
path = "fuzz_targets/config_lexer.rs"
test = false
doc = false

[workspace]
